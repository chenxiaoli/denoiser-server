version: '3.8'

services:
  denoiser-api:
    build:
      context: ..
      dockerfile: denoiser-server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    volumes:
      # Optional: mount a volume for persistent storage of processed files
      - ./output:/app/server/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s 